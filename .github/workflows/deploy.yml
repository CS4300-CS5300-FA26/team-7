name: Deploy to Heroku

on:
  push:
    branches:
      - main    # deploys only when this branch is pushed

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - actions/checkout@v4

      - uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: "crate-app"
          heroku_email: dzarkov2@uccs.edu