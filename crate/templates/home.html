{% extends "crate/base.html" %}


{% block content %}



<div class="homepage container mt-5 center-items">

    <h2>Welcome to Crate</h2>

    {% if user.is_authenticated %}
    <p>Hello, <strong>{{ user.username }}</strong>!</p>
    


    <a href="{% url 'song_list' %} ">My Songs</a>
    {% else %}
    <p>You are not logged in.</p>
    <a href="{% url 'login' %}">Log In</a> | <a href="{% url 'signup' %}">Sign Up</a>
    {% endif %}
</div>



{% endblock %}
