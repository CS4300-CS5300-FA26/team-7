{% extends "crate/base.html" %}
{% block title %}Forgot password - Crate{% endblock %}
{% block content %}
  <div class="container mt-5">
    <h2 style="margin-bottom: 3vh;">Forgot Password</h2>
    <p>Enter your email and we'll send you a login code.</p>
    <form method="post" style="margin-bottom: 3vh;">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Send code</button>
    </form>
    <a href="{% url 'login' %}">Back to log in</a>
  </div>
{% endblock %}
