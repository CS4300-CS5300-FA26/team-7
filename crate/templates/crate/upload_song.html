
<!-- Applies the base template -->
{% extends "crate/base.html" %}

<!-- lists songs using bootstrap table -->
{% block content %}
	<div class="container mt-5">
        <h1>Upload a Song</h1>

        <!-- upload.html Form View -->
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Upload Track</button>
        </form>


    </div>
{% endblock %}
