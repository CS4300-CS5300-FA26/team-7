
<!-- Base file implementation from homework2 specification -->
<!-- gives access to bootstrap CSS for styling -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Crate{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <header class="p-3 text-bg-dark">
      <div class="container"> 
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start"> 
          <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0"> 
            <li><a href="#" class="nav-link px-2 text-secondary">Home</a></li> 
            {% if user.is_authenticated %}
            <li><a href="{% url 'playlists' %}" class="nav-link px-2 text-white">Playlists</a></li>
            <li><a href="{% url 'my_account' %}" class="nav-link px-2 text-white">My Account</a></li>
            <li><a href="{% url 'my_songs' %}" class="nav-link px-2 text-white">My Songs</a></li> 
            <li><a href="{% url 'recommendations' %}" class="nav-link px-2 text-white">Recommendations</a></li> 
            {% else %}
            <li><a href="/" class="nav-link px-2 text-white">About Crate</a></li> 
            {% endif %}
          </ul> 
          
          <div class="text-end"> 
          {% if not user.is_authenticated %}
              <a class="btn btn-primary" href="{% url 'login' %}">Log In</a>
              <a class="btn btn-warning" href="{% url 'signup' %}">Sign-up</a>
          {% else %}
          <!-- Django 5+ requires a POST request to securely log out -->
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button class="btn btn-primary text-light me-2" type="submit">Log Out</button>
            </form>
          {% endif %}
          </div> 
        </div> 
      </div> 
    </header>
    <main>
        <!-- templates will be displayed here -->
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
